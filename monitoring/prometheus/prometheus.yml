global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: adaptive-db-pool-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: adaptive-db-pool

  - job_name: adaptive-db-pool-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - ml-controller:9877
        labels:
          service: adaptive-db-pool-ml
