version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "../postgres/migrations"

    queries:
      - "sql/queries"

    gen:
      go:
        package: "db"
        out: "internal/infrastructure/database/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
